name: Supabase Database Backup

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight UTC
  workflow_dispatch: # Allows manual backups anytime

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create backup directory
        run: mkdir -p supabase-backups

      - name: Dump database schema and data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          : "${SUPABASE_DB_URL:?Set the SUPABASE_DB_URL repository secret}"
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "supabase-backups/schema_$TIMESTAMP.sql"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "supabase-backups/data_$TIMESTAMP.sql" --data-only

      - name: Store database dump as a short-lived workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: supabase-backup-${{ github.run_id }}
          path: supabase-backups/*.sql
          if-no-files-found: error
          retention-days: 7
